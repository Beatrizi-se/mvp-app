name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  confetti: ^0.7.0
  http: ^1.6.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/pato_icone_app.png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/pato_icone_app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
